<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <!-- Gradiente de latão envelhecido / ouro arcano dos anos 1920 -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#dfbe7b"/>
      <stop offset="50%" stop-color="#c5a059"/>
      <stop offset="100%" stop-color="#8c6a2e"/>
    </linearGradient>
    <radialGradient id="abyssBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1e2c24"/>
      <stop offset="75%" stop-color="#121815"/>
      <stop offset="100%" stop-color="#0b0f0d"/>
    </radialGradient>
  </defs>

  <!-- Selo Arcano de Fundo -->
  <circle cx="50" cy="50" r="48" fill="url(#abyssBg)" stroke="url(#goldGrad)" stroke-width="2.5"/>
  <circle cx="50" cy="50" r="42" fill="none" stroke="url(#goldGrad)" stroke-width="1" stroke-dasharray="2,2"/>
  <circle cx="50" cy="50" r="38" fill="none" stroke="url(#goldGrad)" stroke-width="0.8"/>

  <!-- Pentagrama entrelaçado de 5 pontas -->
  <!-- Vértices ordenados para desenhar a estrela de 5 pontas contínua:
       1: (50, 14)
       2: (71, 78)
       3: (16, 38)
       4: (84, 38)
       5: (29, 78)
  -->
  <polyline
    points="50,14 71,78 16,38 84,38 29,78 50,14"
    fill="none"
    stroke="url(#goldGrad)"
    stroke-width="3.2"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- Pontos arcanos nos vértices -->
  <circle cx="50" cy="14" r="2.2" fill="url(#goldGrad)"/>
  <circle cx="71" cy="78" r="2.2" fill="url(#goldGrad)"/>
  <circle cx="16" cy="38" r="2.2" fill="url(#goldGrad)"/>
  <circle cx="84" cy="38" r="2.2" fill="url(#goldGrad)"/>
  <circle cx="29" cy="78" r="2.2" fill="url(#goldGrad)"/>

  <!-- Núcleo central -->
  <circle cx="50" cy="50" r="3.5" fill="none" stroke="url(#goldGrad)" stroke-width="1.2"/>
</svg>
